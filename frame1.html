<style>
  /* ==================================================================
     FRAME 1 — COVER
     Faithfully rebuilt from Figma
       file:  TERQLzNDHMPKXWjSLUTy40  ("Nicole Portfolio")
       node:  3:2  ("Frame 1")  —  1280 x 720
     Every coordinate, font, size and colour below is the EXACT value
     read from the Figma file via the API.

     Content is FULLY EDITABLE and SEPARATED:
       • Text  -> the .portfolio / .name / .role / .next elements below
       • Eye   -> the real Figma vector, exported as inline <svg>
     There is NO flattened background image.
     ================================================================== */

  :root {
    --navy:       #041540;  /* frame background          (Figma frame fill)   */
    --gold:       #E1C05F;  /* PORTFOLIO + eye artwork                         */
    --white:      #FFFFFF;  /* name line                                       */
    --periwinkle: #A3BDFF;  /* "Senior UX Researcher"   (char-style override)  */
    --btn-stroke: #E0E2E7;  /* Next button border (rectangle fill is transparent in Figma) */
  }

  * { margin:0; padding:0; box-sizing:border-box; }

  body {
    background:#111;
    font-family:"Roboto", Arial, "Helvetica Neue", sans-serif;
    display:flex; justify-content:center; align-items:flex-start;
    min-height:100vh; padding:24px;
  }

  /* Holds Figma's 1280x720 (16:9); scales down responsively. */
  .frame {
    position:relative;
    width:1280px; max-width:100%;
    aspect-ratio:1280 / 720;
    background:var(--navy);          /* Figma frame fill #041540 */
    overflow:hidden;
    box-shadow:0 16px 64px rgba(0,0,0,0.6);
    container-type:inline-size;      /* enables cqw text scaling */
  }

  /* ---- Eye illustration ("Face" group) — Figma @(651.1,0) 611x720 ---- */
  .illustration {
    position:absolute;
    left:50.8672%; top:0;
    width:47.7344%; height:100%;
  }
  .eye-art { display:block; width:100%; height:100%; }

  /* ---- PORTFOLIO — @(54,234) box 555x106, Roboto 700 96px, centered ---- */
  .portfolio {
    position:absolute;
    left:4.2188%; top:32.5000%;
    width:43.3594%;
    text-align:center;
    color:var(--gold);
    font-weight:700;
    font-size:7.5000cqw;
    line-height:1.171875;
    white-space:nowrap;
  }

  /* ---- Name + role — @(94,394) box 475x86, Roboto 400, centered ----
     Single Figma text node, two lines with a per-character style override
     on the second line (24px / periwinkle). */
  .name-block {
    position:absolute;
    left:7.3438%; top:54.7222%;
    width:37.1094%;
    text-align:center;
    line-height:1.171875;
  }
  .name { display:block; color:var(--white);      font-weight:400; font-size:2.8125cqw; }
  .role { display:block; color:var(--periwinkle); font-weight:400; font-size:1.8750cqw; }

  /* ---- Next button ("Group 22") — @(275,534) 114x35, radius 6 ----
     Figma "Rectangle 23": fill #D9D9D9 at opacity 0 (i.e. transparent),
     1px #E0E2E7 border; "Next" text 12px white. */
  .next {
    position:absolute;
    left:21.4844%; top:74.1667%;
    width:8.9062%; height:4.8611%;
    display:flex; align-items:center; justify-content:center;
    background:transparent;
    border:1px solid var(--btn-stroke);
    border-radius:6px;
    color:var(--white);
    font-weight:400;
    font-size:0.9375cqw;
    text-decoration:none;
    cursor:pointer;
  }
  .next:hover { background:rgba(255,255,255,0.12); }
</style>
